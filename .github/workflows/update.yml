# Nightly at 3 AM Eastern (after the last West Coast games end): fetch NHL data, rebuild the Red Wings widget and Hockey Lab data, and merge it into
# Firestore (pat-dashboard-eb494). Writes only add or update; nothing already stored is dropped.
# Cron is UTC, so both 07:00 and 08:00 UTC are scheduled (3 AM EDT / EST); the run that isn't
# 3 AM in New York (by daylight saving, so a late start still runs) stops before fetching anything. Manual runs and pushes always fetch.
name: Update dashboard data
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # a push rebuilds everything (and spends Firestore reads/writes), so docs, notes, tests and other workflows' files
    # don't start one (2026-10-16: 15 push-triggered builds in a day exhausted the free daily read quota)
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "scripts/*.test.mjs"
      - "scripts/fixtures/**"
      - ".github/workflows/capwages.yml"
      - ".github/workflows/trades.yml"
      - ".github/workflows/season.yml"
      - ".github/workflows/live.yml"
      - ".github/workflows/dispatch.yml"
      - ".github/workflows/contracts.yml"
      - ".github/workflows/budget.yml"

permissions:
  contents: write   # only for the occasional keep-alive commit below

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Only at 3 AM Eastern
        id: hour
        # 07:00 UTC is 3 AM in summer (EDT, UTC-4) and 08:00 UTC is 3 AM in winter (EST, UTC-5): each cron runs only in
        # its half of the year. Keyed to the offset, not the clock hour, so a run GitHub starts late still happens.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset=$(TZ=America/New_York date +%z)
            if { [ "${{ github.event.schedule }}" = "0 7 * * *" ] && [ "$offset" != "-0400" ]; } || \
               { [ "${{ github.event.schedule }}" = "0 8 * * *" ] && [ "$offset" != "-0500" ]; }; then
              echo "This cron is for the other half of the year (New York is UTC$offset); skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.hour.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.hour.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.hour.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.hour.outputs.skip != 'true'
        run: npm ci && pip install requests
      # Last night's games from Firestore, so the build only fetches new ones from the NHL
      - name: Restore from Firestore
        if: steps.hour.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/restore.mjs
      - name: Build
        if: steps.hour.outputs.skip != 'true'
        run: node --test tests/competition.test.mjs && node scripts/redwings.mjs && node scripts/competition.mjs
      # New signings from tonight's news, applied to the stored contract list (the weekly job does the full refresh)
      - name: Contract news
        if: steps.hour.outputs.skip != 'true'
        run: python scripts/contracts.py --recent || echo "contract news check failed; stored contracts are kept"
      # CapWages (licensed API): fail-closed import into owner-only capwages/*; prints counts only (this log is public)
      - name: CapWages contracts and cap
        if: steps.hour.outputs.skip != 'true'
        env:
          CAPWAGES_API_KEY: ${{ secrets.CAPWAGES_API_KEY }}
          CAPWAGES_API_USER: ${{ secrets.CAPWAGES_API_USER }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node --test scripts/capwages.test.mjs && node scripts/capwages.mjs || echo "CapWages import didn't publish; the previous import keeps serving (see the Admin page)"
      - name: Trade block from the news
        run: python scripts/block.py || echo "trade block scan failed; last night's list is kept"
      - name: Team assets (draft picks and prospects)
        run: node scripts/assets.mjs || echo "assets build failed; last night's assets are kept"
      # Shot-quality standings (F02): exact replay of every game's shots -> points from the chances
      - name: Shot-quality standings
        if: steps.hour.outputs.skip != 'true'
        run: node scripts/xgStandings.mjs || echo "shot-quality standings failed; last night's are kept"
      # Rest and travel (F13): next two weeks' rest, back-to-backs and miles, with the measured effects (model/restEffect.json)
      - name: Rest and travel
        if: steps.hour.outputs.skip != 'true'
        run: node scripts/restTravel.mjs || echo "rest and travel failed; last night's are kept"
      # Milestone watch (F12): career totals from NHL player pages (cached a week; players near a milestone nightly)
      - name: Player career cache
        if: steps.hour.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/careers
          key: careers-${{ github.run_id }}
          restore-keys: careers-
      - name: Milestone watch
        if: steps.hour.outputs.skip != 'true'
        run: node scripts/milestones.mjs || echo "milestone watch failed; last night's list is kept"
      - name: Data checks (invariants)
        if: steps.hour.outputs.skip != 'true'
        run: node scripts/invariants.mjs || echo "some data checks failed; see the Admin page"
      - name: Man-games lost to injury
        if: steps.hour.outputs.skip != 'true'
        run: node scripts/injuries.mjs || echo "injury build failed; last night's numbers are kept"
      # Roster-aware season simulation (lineups, starting goalies, injuries): shadow next to the team-only one unless
      # model/config.json says "simModel": "roster"
      - name: Roster-aware simulation
        if: steps.hour.outputs.skip != 'true'
        run: node scripts/rosterSim.mjs || echo "roster simulation failed; team-only projections are published"
      # Drift alarms (live calibration and input distributions vs the scorecards) and the champion/challenger record
      - name: Drift alarms
        if: steps.hour.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/drift.mjs || echo "drift checks failed; see the Admin page"
      # Versioned model artifacts: manifest with content hashes + write-once copies of each new version
      - name: Model artifacts
        if: steps.hour.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/artifacts.mjs || echo "artifact manifest failed; last night's is kept"
      # Slim companions of the players and injuries documents for the site's first paint (perf step 2)
      - name: Slim documents
        if: steps.hour.outputs.skip != 'true'
        run: node scripts/lite.mjs || echo "slim documents not built; the site falls back to the full ones"
      # Merge tonight's data into Firestore (only overwrites what came back new)
      - name: Publish to Firestore
        if: steps.hour.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/publish.mjs
      # Hockey Lab / Today: tonight's edition from the published recaps, league build and question bank (selector tests gate it)
      - name: Today edition
        if: steps.hour.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node --test scripts/todaySelect.test.mjs && node scripts/today.mjs || echo "Today edition not published; last edition kept (the page dates it)"
      # What the models could see tonight, kept once per day for point-in-time backtests (owner only)
      - name: Point-in-time snapshot
        if: steps.hour.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/snapshot.mjs || echo "snapshot failed; tomorrow's run tries again"
      # Rating history (write-once): this month's ratings and every finished season's final ratings, for future aging curves
      - name: Rating history
        if: steps.hour.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/ratingSnapshot.mjs || echo "rating history failed; tomorrow's run tries again"
      - name: Record a failed run for the admin panel
        if: failure() && steps.hour.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/publish.mjs admin
      # GitHub pauses scheduled workflows in repos with no commits for 60 days. Nudge it well before that.
      - name: Keep the schedule alive
        if: steps.hour.outputs.skip != 'true'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi
